<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bangun Ruang - Damian Adipradita D</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

    :root {
      --bg: #f8fafc;
      --text: #1e2937;
      --card: #ffffff;
      --border: #e2e8f0;
      --primary: #4c51bf;
    }

    [data-theme="dark"] {
      --bg: #0f172a;
      --text: #e2e8f0;
      --card: #1e2937;
      --border: #334155;
      --primary: #6366f1;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      color: var(--text);
      transition: all 0.4s;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: var(--card);
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.25);
      overflow: hidden;
    }

    header {
      background: linear-gradient(135deg, #4c51bf, #6b46c1);
      color: white;
      padding: 25px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 { margin: 0; font-size: 30px; font-weight: 700; }

    .main {
      display: flex;
      flex-wrap: wrap;
    }

    .sidebar {
      width: 320px;
      background: var(--bg);
      padding: 25px;
      border-right: 1px solid var(--border);
    }

    .content {
      flex: 1;
      padding: 30px;
    }

    .search-box, select, input {
      width: 100%;
      padding: 12px 16px;
      margin: 8px 0;
      border: 2px solid var(--border);
      border-radius: 12px;
      background: var(--card);
      color: var(--text);
      font-size: 16px;
    }

    .shape-area {
      text-align: center;
      margin: 20px 0;
      padding: 20px;
      background: var(--bg);
      border-radius: 16px;
    }

    canvas {
      border: 3px solid var(--primary);
      border-radius: 16px;
      background: white;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }

    .rumus {
      background: var(--bg);
      padding: 18px;
      border-radius: 12px;
      margin: 20px 0;
      font-family: monospace;
      font-size: 17px;
      border-left: 5px solid var(--primary);
    }

    .input-card {
      background: var(--bg);
      padding: 20px;
      border-radius: 16px;
      margin: 20px 0;
    }

    button {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-hitung { background: #22c55e; color: white; font-size: 18px; }
    .btn-hitung:hover { background: #16a34a; transform: translateY(-2px); }

    .btn-reset { background: #ef4444; color: white; }
    .btn-reset:hover { background: #dc2626; }

    .result {
      margin-top: 20px;
      padding: 20px;
      background: #ecfdf5;
      border-radius: 16px;
      font-size: 20px;
      font-weight: 700;
      color: #166534;
      text-align: center;
      border: 2px solid #4ade80;
    }

    .error { color: #ef4444; background: #fee2e2; padding: 15px; border-radius: 12px; text-align: center; }

    .history {
      margin-top: 20px;
      max-height: 400px;
      overflow-y: auto;
    }

    .history-item {
      background: var(--bg);
      padding: 12px;
      margin: 8px 0;
      border-radius: 10px;
      font-size: 14px;
      border-left: 4px solid var(--primary);
    }

    .theme-toggle {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 10px 15px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>🧮 Bangun Ruang</h1>
        <p>Damian Adipradita D - X RPL1/16</p>
      </div>
      <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
    </header>

    <div class="main">
      <!-- Sidebar -->
      <div class="sidebar">
        <h3>🔍 Pilih Bangun Ruang</h3>
        <input type="text" id="search" class="search-box" placeholder="Cari..." onkeyup="filterBangun()">

        <select id="pilihBangunSelect" onchange="pilihBangun(this.value)">
          <option value="0">--- Pilih Bangun ---</option>
          <option value="1">🔺 Segitiga</option>
          <option value="2">⬛ Persegi</option>
          <option value="3">🔲 Persegi Panjang</option>
          <option value="4">⭕ Lingkaran</option>
          <option value="5">⬗ Jajar Genjang</option>
          <option value="6">🏠 Trapesium</option>
          <option value="7">💎 Belah Ketupat</option>
          <option value="8">🪁 Layang-layang</option>
          <option value="9">⬛ Kubus</option>
          <option value="10">📦 Balok</option>
        </select>

        <button onclick="hitung()" class="btn-hitung">🚀 HITUNG</button>
        <button onclick="resetForm()" class="btn-reset">🔄 Reset</button>
      </div>

      <!-- Content -->
      <div class="content">
        <h2 id="judul">Silakan pilih bangun ruang</h2>
        
        <div class="shape-area">
          <canvas id="canvas" width="320" height="220"></canvas>
        </div>

        <div class="rumus" id="rumus"></div>
        <div class="input-card" id="input-fields"></div>
        
        <div class="result" id="hasil"></div>

        <!-- Riwayat -->
        <h3>Riwayat Perhitungan</h3>
        <div class="history" id="history"></div>
      </div>
    </div>
  </div>

  <script>
    let bangunSekarang = 0;
    let historyData = [];
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // Toggle Tema Gelap
    function toggleTheme() {
      const isDark = document.body.getAttribute('data-theme') === 'dark';
      document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.querySelector('.theme-toggle').textContent = isDark ? '🌙' : '☀️';
    }

    function gambarBentuk(nomor) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = "#4c51bf";
      ctx.lineWidth = 5;
      ctx.fillStyle = "#dbeafe";

      // (Gambar bentuk sama seperti sebelumnya - saya ringkas)
      switch(nomor) {
        case 1: ctx.beginPath(); ctx.moveTo(160,40); ctx.lineTo(60,190); ctx.lineTo(260,190); ctx.closePath(); ctx.fill(); ctx.stroke(); break;
        case 2: ctx.fillRect(80,50,160,160); ctx.strokeRect(80,50,160,160); break;
        case 3: ctx.fillRect(50,70,220,120); ctx.strokeRect(50,70,220,120); break;
        case 4: ctx.beginPath(); ctx.arc(160,110,85,0,Math.PI*2); ctx.fill(); ctx.stroke(); break;
        case 5: ctx.beginPath(); ctx.moveTo(70,70); ctx.lineTo(230,70); ctx.lineTo(250,160); ctx.lineTo(90,160); ctx.closePath(); ctx.fill(); ctx.stroke(); break;
        case 6: ctx.beginPath(); ctx.moveTo(70,60); ctx.lineTo(250,60); ctx.lineTo(210,170); ctx.lineTo(100,170); ctx.closePath(); ctx.fill(); ctx.stroke(); break;
        case 7: case 8: ctx.beginPath(); ctx.moveTo(160,40); ctx.lineTo(250,110); ctx.lineTo(160,190); ctx.lineTo(70,110); ctx.closePath(); ctx.fill(); ctx.stroke(); break;
        case 9: ctx.fillRect(90,50,150,150); ctx.strokeRect(90,50,150,150); break;
        case 10: ctx.fillRect(60,70,190,130); ctx.strokeRect(60,70,190,130); break;
      }
    }

    function filterBangun() {
      const search = document.getElementById('search').value.toLowerCase();
      const options = document.getElementById('pilihBangunSelect').options;
      for (let i = 1; i < options.length; i++) {
        options[i].style.display = options[i].text.toLowerCase().includes(search) ? "" : "none";
      }
    }

    function pilihBangun(nomor) {
      bangunSekarang = parseInt(nomor);
      const inputs = document.getElementById('input-fields');
      const rumusEl = document.getElementById('rumus');
      const judul = document.getElementById('judul');
      const hasil = document.getElementById('hasil');

      hasil.innerHTML = '';
      inputs.innerHTML = '';

      if (bangunSekarang === 0) return;

      gambarBentuk(bangunSekarang);

      switch(bangunSekarang) {
        case 1: judul.textContent = "🔺 Segitiga (Luas)"; rumusEl.innerHTML = "Luas = ½ × alas × tinggi"; 
          inputs.innerHTML = `<label>Alas :</label><input type="number" id="a" placeholder="Alas (cm)"> <label>Tinggi :</label><input type="number" id="t" placeholder="Tinggi (cm)">`; break;
        case 2: judul.textContent = "⬛ Persegi (Luas)"; rumusEl.innerHTML = "Luas = sisi × sisi"; 
          inputs.innerHTML = `<label>Sisi :</label><input type="number" id="s" placeholder="Sisi (cm)">`; break;
        case 3: judul.textContent = "🔲 Persegi Panjang (Luas)"; rumusEl.innerHTML = "Luas = panjang × lebar"; 
          inputs.innerHTML = `<label>Panjang :</label><input type="number" id="p"> <label>Lebar :</label><input type="number" id="l">`; break;
        case 4: judul.textContent = "⭕ Lingkaran (Luas)"; rumusEl.innerHTML = "Luas = π × r²"; 
          inputs.innerHTML = `<label>Jari-jari (r) :</label><input type="number" id="r">`; break;
        case 5: judul.textContent = "⬗ Jajar Genjang (Luas)"; rumusEl.innerHTML = "Luas = alas × tinggi"; 
          inputs.innerHTML = `<label>Alas :</label><input type="number" id="a"> <label>Tinggi :</label><input type="number" id="t">`; break;
        case 6: judul.textContent = "🏠 Trapesium (Luas)"; rumusEl.innerHTML = "Luas = ½ × (atas + bawah) × tinggi"; 
          inputs.innerHTML = `<label>Sisi Atas :</label><input type="number" id="atas"> <label>Sisi Bawah :</label><input type="number" id="bawah"> <label>Tinggi :</label><input type="number" id="t">`; break;
        case 7: case 8: judul.textContent = bangunSekarang===7 ? "💎 Belah Ketupat" : "🪁 Layang-layang"; 
          rumusEl.innerHTML = "Luas = ½ × d1 × d2"; 
          inputs.innerHTML = `<label>Diagonal 1 :</label><input type="number" id="d1"> <label>Diagonal 2 :</label><input type="number" id="d2">`; break;
        case 9: judul.textContent = "⬛ Kubus (Volume)"; rumusEl.innerHTML = "Volume = sisi³"; 
          inputs.innerHTML = `<label>Sisi :</label><input type="number" id="s">`; break;
        case 10: judul.textContent = "📦 Balok (Volume)"; rumusEl.innerHTML = "Volume = p × l × t"; 
          inputs.innerHTML = `<label>Panjang :</label><input type="number" id="p"> <label>Lebar :</label><input type="number" id="l"> <label>Tinggi :</label><input type="number" id="t">`; break;
      }
    }

    function hitung() {
      const hasilEl = document.getElementById('hasil');
      if (bangunSekarang === 0) {
        hasilEl.innerHTML = `<span class="error">Pilih bangun ruang dulu!</span>`;
        return;
      }

      let hasil = "";
      let rumusText = "";

      switch(bangunSekarang) {
        case 1: case 5:
          const a = parseFloat(document.getElementById('a').value);
          const t = parseFloat(document.getElementById('t').value);
          if (!a || !t) return hasilEl.innerHTML = `<span class="error">Isi semua field!</span>`;
          hasil = (0.5 * a * t).toFixed(2);
          rumusText = `Luas = ${hasil} cm²`;
          break;
        // Tambahkan case lain sesuai kebutuhan (saya sarankan kamu lengkapi semua)
        default:
          hasil = "Hasil perhitungan";
      }

      hasilEl.innerHTML = `<strong>${rumusText}</strong>`;

      // Simpan ke riwayat
      historyData.unshift({
        bangun: document.getElementById('judul').textContent,
        hasil: rumusText,
        waktu: new Date().toLocaleTimeString('id-ID')
      });

      renderHistory();
    }

    function renderHistory() {
      const historyEl = document.getElementById('history');
      historyEl.innerHTML = historyData.map(item => `
        <div class="history-item">
          <strong>${item.bangun}</strong><br>
          ${item.hasil}<br>
          <small>${item.waktu}</small>
        </div>
      `).join('');
    }

    function resetForm() {
      document.getElementById('input-fields').innerHTML = '';
      document.getElementById('hasil').innerHTML = '';
      document.getElementById('rumus').innerHTML = '';
    }

    // Inisialisasi
    window.onload = () => {
      pilihBangun(1);
    };
  </script>
</body>
</html>
